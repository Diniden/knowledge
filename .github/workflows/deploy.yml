name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -f server/Dockerfile -t kg-server:${{ github.ref_name }} .
          docker build -f client/Dockerfile -t kg-client:${{ github.ref_name }} .

